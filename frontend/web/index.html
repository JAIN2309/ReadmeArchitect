<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI-powered README generator for any public GitHub repository. Paste a repo URL, select a presentation mode, and get a publish-ready README instantly.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="README Architect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>README Architect — AI-Powered Documentation Generator</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #09090B;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #09090B;
      z-index: 99999;
      gap: 16px;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3B82F6;
      animation: spin 0.8s ease-in-out infinite;
    }
    .loading-text {
      color: #A1A1AA;
      font-size: 13px;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading ReadmeArchitect...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // MutationObserver to automatically remove #loading element once Flutter Web mounts
    (function() {
      var observer = new MutationObserver(function(mutations) {
        var loader = document.getElementById('loading');
        var flutterView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (flutterView && loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 300);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback timeout: remove loader after 6 seconds max
      setTimeout(function() {
        var loader = document.getElementById('loading');
        if (loader && loader.parentNode) {
          loader.parentNode.removeChild(loader);
        }
      }, 6000);
    })();
  </script>
</body>
</html>
